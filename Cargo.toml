[workspace]
members = ["crates/oxitailr-core", "crates/oxitailr", "desktop/src-tauri"]
# Plain `cargo build/test/clippy` at the root covers the engine and the terminal
# app. The desktop app needs WebKitGTK/WebView2 to build, so it is built on its
# own (`cargo build -p oxitailr-desktop`, or `npm run tauri build` in desktop/).
default-members = ["crates/oxitailr-core", "crates/oxitailr"]
resolver = "2"

[workspace.package]
version = "0.4.1"
edition = "2021"
authors = ["Oxitailr Contributors"]
license = "MIT"

# One version of each dependency for every crate in the workspace; each crate
# opts in with `name.workspace = true`.
[workspace.dependencies]
# The engine library (crates/oxitailr-core)
oxitailr-core = { path = "crates/oxitailr-core" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Terminal UI (event-driven, retained-mode — replaces the egui GUI)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Security - KDF (argon2 only reads the legacy credentials file) and randomness
argon2 = "0.6.0"
rand = "0.8"
shlex = "1.3"


# Glob patterns
glob = "0.3"

# SSH
russh = "0.45"
russh-keys = "0.45"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Regex
regex = "1.10"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Notifications
notify-rust = "4.10"

# HTTP client (rustls instead of native-tls to avoid an OpenSSL system dependency,
# which also keeps the Windows cross-compile and AppImage builds self-contained)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Directories
dirs = "5.0"

# Encryption for password storage
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
base64 = "0.22"

# Secret store (crates/oxitailr-core/src/secrets.rs): keyring-core plus one OS
# keychain per platform — Windows Credential Manager, macOS Keychain, and the
# Linux Secret Service over pure-Rust zbus (no libdbus) — and zeroizing secrets
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
secrecy = "0.10.3"
zeroize = "1.9.1"

# Desktop app (desktop/src-tauri)
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.7.3", features = [] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-notification = "2.7.0"

# Tests
tempfile = "3.10"
