[package]
name = "oxitailr"
version = "0.2.0"
edition = "2021"
description = "A modern, feature-rich log viewer with GUI interface"
authors = ["Oxitailr Contributors"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# GUI
eframe = "0.29"
egui_extras = "0.29"

# File watching
notify = "6.1"

# SSH
russh = "0.45"
russh-keys = "0.45"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Regex
regex = "1.10"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Notifications
notify-rust = "4.10"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Directories
dirs = "5.0"

# Secure password storage
keyring = "3"

# Image loading (for app icon)
image = { version = "0.25", default-features = false, features = ["png"] }

# File dialogs
rfd = "0.15"

[dev-dependencies]
tempfile = "3.10"
