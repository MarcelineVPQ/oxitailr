[package]
name = "oxitailr"
version = "0.3.3"
edition = "2021"
description = "A fast, low-resource terminal log viewer / live tailer"
authors = ["Oxitailr Contributors"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Terminal UI (event-driven, retained-mode — replaces the egui GUI)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Security - KDF and randomness
argon2 = "0.5"
rand = "0.8"
shlex = "1.3"


# Glob patterns
glob = "0.3"

# SSH
russh = "0.45"
russh-keys = "0.45"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Regex
regex = "1.10"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Notifications
notify-rust = "4.10"

# HTTP client (rustls instead of native-tls to avoid an OpenSSL system dependency,
# which also keeps the Windows cross-compile and AppImage builds self-contained)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Directories
dirs = "5.0"

# Encryption for password storage
aes-gcm = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.10"
