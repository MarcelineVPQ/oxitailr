[package]
name = "oxitailr"
version = "0.2.18"
edition = "2021"
description = "A modern, feature-rich log viewer with GUI interface"
authors = ["Oxitailr Contributors"]
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# GUI
eframe = { version = "0.29", features = ["persistence"] }

# Security - KDF and randomness
argon2 = "0.5"
rand = "0.8"
shlex = "1.3"

# File watching
notify = "6.1"

# Glob patterns
glob = "0.3"

# SSH
russh = "0.45"
russh-keys = "0.45"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Regex
regex = "1.10"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Notifications
notify-rust = "4.10"

# HTTP client (rustls instead of native-tls to avoid an OpenSSL system dependency,
# which also keeps the Windows cross-compile and AppImage builds self-contained)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Directories
dirs = "5.0"

# Encryption for password storage
aes-gcm = "0.10"
base64 = "0.22"

# Image loading (for app icon)
image = { version = "0.25", default-features = false, features = ["png"] }

# File dialogs
rfd = "0.15"

# System theme detection
dark-light = "1.1"

[build-dependencies]
embed-resource = "2.4"

[dev-dependencies]
tempfile = "3.10"
