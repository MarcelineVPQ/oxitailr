name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base, so stacked PRs (e.g. #18 on #17) get CI too.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --verbose

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Setup Node.js for jscpd
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for code duplication
        run: |
          npx jscpd crates/ \
            --min-lines 10 \
            --min-tokens 50 \
            --threshold 5 \
            --reporters console \
            --ignore "**/*.md"

  # The app (desktop/) is a workspace member but not a default member, so the
  # test job above (the engine) never builds it. These two jobs do, and build
  # the same AppImage and Windows installer as release.yml, so a broken one
  # shows up before a tag.
  desktop:
    name: App (Linux, AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Install front-end dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck front end
        working-directory: desktop
        run: npm run typecheck

      # Must run before any cargo step: tauri::generate_context! embeds desktop/dist.
      - name: Build front end
        working-directory: desktop
        run: npm run build

      - name: Check formatting
        run: cargo fmt -p oxitailr-desktop -- --check

      - name: Run clippy
        run: cargo clippy -p oxitailr-desktop -- -D warnings

      - name: Run tests
        run: cargo test -p oxitailr-desktop

      # The cargo cache restores target/, including bundles from earlier builds.
      - name: Clear old bundles
        run: rm -rf target/release/bundle

      # linuxdeploy is itself an AppImage: extract-and-run avoids needing FUSE
      # on the runner; NO_STRIP avoids its old strip choking on newer libraries.
      - name: Build AppImage
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npx tauri build --bundles appimage

      - uses: actions/upload-artifact@v4
        with:
          name: oxitailr-linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  desktop-windows:
    name: App (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-desktop-

      - name: Install front-end dependencies
        working-directory: desktop
        run: npm ci

      # The cargo cache restores target/, including installers from earlier builds.
      - name: Clear old installers
        shell: bash
        run: rm -rf target/release/bundle

      # Same NSIS bundle as release.yml, so a broken installer shows up before a tag.
      - name: Build installer
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: oxitailr-windows-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
