name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag -a v0.5.0 -m "v0.5.0" && git push origin v0.5.0
# This builds the app's Linux AppImage and Windows installer, named per
# CLAUDE.md, and attaches them to a GitHub release for the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Gates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --verbose

  build-linux:
    name: Build AppImage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cached: a plain apt-get update + install took 29 min on a slow mirror (2026-10-23).
      # The cache key is the package list; change the list or `version` to refresh it.
      - name: Install Tauri Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config file
          version: 1
          execute_install_scripts: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-
      - name: Install front-end dependencies
        working-directory: desktop
        run: npm ci
      # The cargo cache restores target/, including bundles from earlier builds.
      - name: Clear old bundles
        run: rm -rf target/release/bundle
      # linuxdeploy is itself an AppImage: extract-and-run avoids needing FUSE;
      # NO_STRIP avoids its old strip choking on newer libraries.
      - name: Build AppImage
        working-directory: desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: npx tauri build --bundles appimage
      - name: Package AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/release/bundle/appimage/Oxitailr_${VERSION}_amd64.AppImage "Oxitailr-${VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Oxitailr-*-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows installer
    # Tauri needs a Windows host for WebView2 and the NSIS bundler.
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-
      - name: Install front-end dependencies
        working-directory: desktop
        run: npm ci
      # The cargo cache restores target/, including installers from earlier builds.
      - name: Clear old installers
        shell: bash
        run: rm -rf target/release/bundle
      # NSIS only: one installer, and MSI refuses pre-release versions.
      - name: Build installer
        working-directory: desktop
        run: npx tauri build --bundles nsis
      - name: Package installer
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/release/bundle/nsis/Oxitailr_${VERSION}_x64-setup.exe" "Oxitailr-${VERSION}-x86_64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Oxitailr-*-x86_64-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
