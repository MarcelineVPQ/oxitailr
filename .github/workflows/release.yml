name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.2.17 && git push origin v0.2.17
# This builds the terminal app (Linux, Windows, AppImage) and the desktop
# app's Windows installer, named per CLAUDE.md, and attaches them to a GitHub release for the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # GUI/X11 build dependencies for eframe.
  LINUX_DEPS: >-
    libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    libxkbcommon-dev libssl-dev libgtk-3-dev

jobs:
  check:
    name: Gates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --verbose

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Build release
        run: cargo build --release
      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/release/oxitailr "oxitailr-${VERSION}-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: oxitailr-*-x86_64
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-windows-
      - name: Build Windows release
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/x86_64-pc-windows-gnu/release/oxitailr.exe "oxitailr-${VERSION}-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: oxitailr-*-x86_64.exe
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS wget
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Stage icon for AppImage
        # build-appimage.sh expects the icon under release/ (which is gitignored).
        run: |
          mkdir -p release
          cp assets/icon_256x256.png release/icon_256x256.png
      - name: Build AppImage
        run: ./appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/Oxitailr-*-x86_64.AppImage
          if-no-files-found: error

  build-desktop-windows:
    name: Build desktop app (Windows installer)
    # Tauri needs a Windows host for WebView2 and the NSIS bundler; the MinGW
    # cross-compile used by build-windows doesn't fit it.
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-
      - name: Install front-end dependencies
        working-directory: desktop
        run: npm ci
      # The cargo cache restores target/, including installers from earlier builds.
      - name: Clear old installers
        shell: bash
        run: rm -rf target/release/bundle
      # NSIS only: one installer, and MSI refuses pre-release versions.
      - name: Build installer
        working-directory: desktop
        run: npx tauri build --bundles nsis
      - name: Package installer
        shell: bash
        # Named apart from the terminal app's oxitailr-<ver>-x86_64.exe.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/release/bundle/nsis/Oxitailr_${VERSION}_x64-setup.exe" "Oxitailr-Desktop-${VERSION}-x86_64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: Oxitailr-Desktop-*-x86_64-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-appimage, build-desktop-windows]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
