name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.2.17 && git push origin v0.2.17
# This builds all three binaries (Linux, Windows, AppImage) named per
# CLAUDE.md and attaches them to a GitHub release for the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # GUI/X11 build dependencies for eframe.
  LINUX_DEPS: >-
    libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
    libxkbcommon-dev libssl-dev libgtk-3-dev

jobs:
  check:
    name: Gates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --verbose

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Build release
        run: cargo build --release
      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/release/oxitailr "oxitailr-${VERSION}-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: oxitailr-*-x86_64
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-windows-
      - name: Build Windows release
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp target/x86_64-pc-windows-gnu/release/oxitailr.exe "oxitailr-${VERSION}-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: oxitailr-*-x86_64.exe
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS wget
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Stage icon for AppImage
        # build-appimage.sh expects the icon under release/ (which is gitignored).
        run: |
          mkdir -p release
          cp assets/icon_256x256.png release/icon_256x256.png
      - name: Build AppImage
        run: ./appimage/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: release/Oxitailr-*-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-appimage]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
