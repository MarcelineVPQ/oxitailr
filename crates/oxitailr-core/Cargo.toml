[package]
name = "oxitailr-core"
description = "The engine behind oxitailr: log sources (local, SSH), parsing, filters, alerts, config and sessions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
async-trait.workspace = true
argon2.workspace = true
shlex.workspace = true
russh.workspace = true
russh-keys.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
notify-rust.workspace = true
reqwest.workspace = true
tracing.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
dirs.workspace = true
aes-gcm.workspace = true
base64.workspace = true
keyring-core.workspace = true
secrecy.workspace = true
zeroize.workspace = true

# OS keychain backends for the secret store, one per platform.
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
